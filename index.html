<!-- index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dikeh Daniel — Frontend Engineer in Lagos</title>
    <meta name="description" content="Dikeh Daniel is a frontend engineer in Lagos, Nigeria, building useful web applications with React, Next.js, and TypeScript." />
    <meta name="author" content="Dikeh Daniel" />
    <meta name="theme-color" content="#F4F6F2" />
    <meta name="color-scheme" content="light dark" />

    <!-- Set the saved (or system) theme before first paint so there is no flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.classList.toggle("dark", t === "dark");
          document.documentElement.style.colorScheme = t;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", t === "dark" ? "#0E151B" : "#F4F6F2");
        } catch (e) {}
      })();
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dikeh Daniel — Frontend Engineer in Lagos" />
    <meta property="og:description" content="Dikeh Daniel is a frontend engineer in Lagos, Nigeria, building useful web applications with React, Next.js, and TypeScript." />
    <meta property="og:url" content="https://my-portfolio-orpin-ten-19.vercel.app/" />

    <!-- Twitter -->

  </head>

  </body>
</html>
